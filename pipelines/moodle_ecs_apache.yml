# pySigma processing pipeline.
# Maps the Sigma webserver taxonomy onto ECS fields as produced by the Elastic Apache integration,
# and scopes every converted rule to your Moodle access log source.
#
# Usage:
#   sigma convert -t lucene -p pipelines/moodle_ecs_apache.yml rules/web/moodle/
#
# Before use, edit the event.module value in the moodle_scope_to_log_source transformation below.
# It must be set directly on the transformation - pipeline vars are not expanded inside
# add_condition values, only inside |expand placeholders.
name: moodle-ecs-apache
priority: 20
# Values consumed by the |expand placeholders in the rules under internal/.
# Replace with your organisation's real values and keep the real version out of any public repo.
vars:
  moodle_approved_countries:
    - 'XX'
  moodle_monitoring_sources:
    - '203.0.113.10'
    - '203.0.113.11'
transformations:
  - id: moodle_webserver_field_mapping
    type: field_name_mapping
    mapping:
      c-ip: source.ip
      cs-method: http.request.method
      cs-uri-stem: url.path
      cs-uri-query: url.query
      sc-status: http.response.status_code
      cs-user-agent: user_agent.original
      cs-referer: http.request.referrer
      cs-host: url.domain
      cs-username: user.name
      s-ip: destination.ip
      s-port: url.port
      sc-bytes: http.response.body.bytes
      cs-bytes: http.request.body.bytes
    rule_conditions:
      - type: logsource
        category: webserver

  - id: moodle_scope_to_log_source
    type: add_condition
    conditions:
      event.module: 'CHANGE_ME_moodle_apache_access'
    rule_conditions:
      - type: logsource
        category: webserver

  # Expands the placeholders above in the rules under internal/.
  - id: moodle_placeholders
    type: value_placeholders
    include:
      - moodle_approved_countries
      - moodle_monitoring_sources
